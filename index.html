<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Driftway — 无尽公路</title>
<style>
  :root{color-scheme:dark;--glass:rgba(18,24,31,.48);--line:rgba(255,255,255,.16);--text:#f7fbff;--muted:rgba(247,251,255,.72)}
  *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#9bc7da;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  canvas{display:block;width:100%;height:100%;touch-action:none} canvas:focus{outline:none} canvas:focus-visible{outline:3px solid rgba(255,255,255,.78);outline-offset:-5px}
  #ui{position:fixed;inset:0;pointer-events:none;color:var(--text);text-shadow:0 1px 10px rgba(0,0,0,.25);user-select:none}
  .glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.10)}
  #stats{position:absolute;left:18px;top:18px;border-radius:16px;padding:13px 16px;min-width:142px}
  #speed{font-size:28px;font-weight:650;line-height:1;letter-spacing:-.02em}
  #distance{font-size:13px;margin-top:8px;color:var(--muted)}
  #topRight{position:absolute;right:18px;top:18px;display:flex;gap:8px;align-items:center;pointer-events:auto}
  button{font:inherit;color:var(--text);border:1px solid var(--line);background:var(--glass);border-radius:13px;padding:9px 12px;min-width:44px;min-height:44px;cursor:pointer;touch-action:manipulation;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 26px rgba(0,0,0,.09)}
  button:hover{background:rgba(31,40,50,.62)} button:active{transform:translateY(1px)}
  #seed{padding:9px 11px;border-radius:13px;font-size:12px;color:var(--muted);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #hint{position:absolute;left:50%;top:18%;transform:translateX(-50%);padding:13px 20px;border-radius:18px;font-size:16px;transition:opacity 1.2s ease,transform 1.2s ease;white-space:nowrap}
  #hint.hide{opacity:0;transform:translate(-50%,-8px)}
  #help{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);padding:14px 18px;border-radius:17px;font-size:13px;line-height:1.7;color:var(--muted);opacity:0;transition:opacity .2s ease;pointer-events:none;text-align:center;min-width:min(92vw,520px)}
  #help.show{opacity:1}
  #pauseScreen{position:absolute;inset:0;display:none;place-items:center;background:rgba(12,18,24,.18);font-size:34px;font-weight:650;letter-spacing:.08em}
  #pauseScreen.show{display:grid}
  #error{position:fixed;inset:0;display:none;place-items:center;background:#101820;color:#fff;padding:24px;z-index:10}
  #error .card{max-width:680px;padding:26px 28px;border-radius:20px;background:#18242e;border:1px solid rgba(255,255,255,.13);line-height:1.7}
  #error strong{font-size:21px;display:block;margin-bottom:8px}
  #debug{position:absolute;left:18px;bottom:18px;display:none;padding:10px 12px;border-radius:12px;font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;color:rgba(255,255,255,.82);white-space:pre}
  #debug.show{display:block}
  #error:focus-visible{outline:3px solid rgba(255,255,255,.85);outline-offset:-8px}
  #touchControls{display:none;position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));padding:0 max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));justify-content:space-between;align-items:end;pointer-events:none}
  .touchGroup{display:flex;gap:10px;align-items:end;pointer-events:auto}
  .touchBtn{width:72px;height:72px;border-radius:50%;padding:0;font-size:24px;font-weight:700;touch-action:none;-webkit-user-select:none;user-select:none;background:rgba(18,24,31,.40)}
  .touchBtn.small{width:48px;height:48px;font-size:14px}
  .touchBtn:active,.touchBtn.active{background:rgba(60,76,92,.70);transform:scale(.97)}
  #touchUtility{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);display:flex;gap:10px;pointer-events:auto}
  #rotateGate{display:none;position:fixed;inset:0;z-index:9;background:rgba(12,18,24,.94);color:#fff;place-items:center;padding:28px;text-align:center;pointer-events:auto}
  #rotateGate .rotateCard{max-width:420px;display:grid;gap:14px;justify-items:center}
  #rotateGate strong{font-size:24px;letter-spacing:.03em}#rotateGate p{margin:0;color:rgba(255,255,255,.72);line-height:1.65}
  #landscapeBtn{padding:11px 18px;min-width:132px}
  #autoBtn[aria-pressed="true"]{background:rgba(86,116,104,.72);border-color:rgba(214,255,233,.38)}
  @media(max-width:700px){#seed{display:none}#stats{padding:10px 12px;min-width:124px}#speed{font-size:24px}#topRight{gap:6px}#envBtn{max-width:78px;overflow:hidden;white-space:nowrap}button{padding:8px 10px}}
  @media (hover:none) and (pointer:coarse){
    #rotateGate{display:none!important}
    #touchControls{display:flex;bottom:max(10px,env(safe-area-inset-bottom));padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
    .touchBtn{width:64px;height:64px;font-size:22px;padding:0}.touchBtn.small{width:46px;height:46px;font-size:12px}
    #touchUtility{bottom:5px;gap:8px}#help{bottom:86px}.glass,button{backdrop-filter:none;-webkit-backdrop-filter:none}
    #stats{left:max(12px,env(safe-area-inset-left));top:10px}#topRight{right:max(12px,env(safe-area-inset-right));top:10px}#hint{top:12%;font-size:13px;padding:9px 14px}
  }
  /* Portrait phones still render the game as a landscape surface. No orientation lock or sensor takeover. */
  @media (hover:none) and (pointer:coarse) and (orientation:portrait){
    canvas,#ui{position:fixed;inset:auto;left:50%;top:50%;width:100vh;height:100vw;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center center}
  }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="3D 无尽驾驶游戏"></canvas>
<div id="ui">
  <div id="stats" class="glass"><div id="speed">0 km/h</div><div id="distance">0.0 km</div></div>
  <div id="topRight">
    <div id="seed" class="glass" title="可用 #seed=数字 复现世界">Seed —</div>
    <button id="envBtn" title="切换环境" aria-label="切换环境模式">☀ 晴天</button>
    <button id="autoBtn" title="自动前进（T）" aria-label="开启自动前进" aria-pressed="false">自动</button>
    <button id="muteBtn" title="静音 / 取消静音" aria-label="静音" aria-pressed="false">♪</button>
    <button id="pauseBtn" title="暂停 / 继续" aria-label="暂停游戏" aria-pressed="false">Ⅱ</button>
  </div>
  <div id="hint" class="glass">WASD / 方向键驾驶</div>
  <div id="help" class="glass">W / ↑ 油门　S / ↓ 刹车 / 倒车　A D / ← → 转向　Space 手刹<br>C 切换摄像机　R 回到公路　T 自动前进　P / Esc 暂停　H 帮助　M 静音　F2 性能信息</div>
  <div id="pauseScreen">已暂停</div>
  <div id="debug" class="glass"></div>
  <div id="touchControls" aria-label="触控驾驶控制">
    <div class="touchGroup">
      <button class="touchBtn" data-key="ArrowLeft" aria-label="左转">←</button>
      <button class="touchBtn" data-key="ArrowRight" aria-label="右转">→</button>
    </div>
    <div id="touchUtility">
      <button class="touchBtn small" id="touchAutoBtn" aria-label="自动前进" aria-pressed="false">AUTO</button>
      <button class="touchBtn small" data-key="KeyC" aria-label="切换摄像机">C</button>
      <button class="touchBtn small" data-key="KeyR" aria-label="车辆复位">R</button>
    </div>
    <div class="touchGroup">
      <button class="touchBtn small" data-key="Space" aria-label="手刹">HB</button>
      <button class="touchBtn" data-key="ArrowDown" aria-label="刹车或倒车">▼</button>
      <button class="touchBtn" data-key="ArrowUp" aria-label="油门">▲</button>
    </div>
  </div>
</div>
<div id="error" role="alert" aria-live="assertive" aria-atomic="true" tabindex="-1"><div class="card"><strong id="errorTitle">无法启动游戏</strong><div id="errorText"></div></div></div>
<script>
'use strict';

/* ============================================================
   Driftway — 单文件 WebGL2 无尽驾驶
   所有代码、Shader、几何与程序化内容均内嵌在本 HTML。
   ============================================================ */

// ------------------------------------------------------------
// 0. DOM / 错误处理
// ------------------------------------------------------------
const canvas = document.getElementById('game');
const $speed = document.getElementById('speed');
const $distance = document.getElementById('distance');
const $seed = document.getElementById('seed');
const $envBtn = document.getElementById('envBtn');
const $autoBtn = document.getElementById('autoBtn');
const $touchAutoBtn = document.getElementById('touchAutoBtn');
const $muteBtn = document.getElementById('muteBtn');
const $pauseBtn = document.getElementById('pauseBtn');
const $pauseScreen = document.getElementById('pauseScreen');
const $hint = document.getElementById('hint');
const $help = document.getElementById('help');
const $debug = document.getElementById('debug');
const $error = document.getElementById('error');
const $errorTitle = document.getElementById('errorTitle');
const $errorText = document.getElementById('errorText');
const $touchControls = document.getElementById('touchControls');
const IS_COARSE_POINTER = window.matchMedia ? window.matchMedia('(hover:none) and (pointer:coarse)').matches : false;

function fatal(title, text){
  $errorTitle.textContent = title;
  $errorText.textContent = text;
  $error.style.display = 'grid';
  requestAnimationFrame(()=>$error.focus({preventScroll:true}));
}
window.addEventListener('error', e => fatal('游戏发生错误', e.message || '未知 JavaScript 错误。请刷新页面重试。'));

if (!canvas || !canvas.getContext) fatal('浏览器不支持 Canvas', '请使用较新的 Chrome 或 Edge。');
const gl = canvas.getContext('webgl2', {antialias:true, alpha:false, depth:true, stencil:false, powerPreference:'high-performance'});
if (!gl) fatal('需要 WebGL2', '当前浏览器或显卡没有提供 WebGL2。请在 Windows 上使用较新的 Chrome / Edge，并确认硬件加速已开启。');

canvas.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  fatal('WebGL 上下文已丢失', '显卡上下文被系统回收。请刷新本页面即可重新开始。');
});
canvas.addEventListener('webglcontextrestored', () => location.reload());

// ------------------------------------------------------------
// 1. Math / Vector / Matrix
// ------------------------------------------------------------
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const smoothstep = (a,b,x)=>{ x=clamp((x-a)/(b-a),0,1); return x*x*(3-2*x); };
const expLerp = (a,b,rate,dt)=>lerp(a,b,1-Math.exp(-rate*dt));

function hashU32(x){
  x = Math.imul(x ^ (x >>> 16), 0x7feb352d);
  x = Math.imul(x ^ (x >>> 15), 0x846ca68b);
  return (x ^ (x >>> 16)) >>> 0;
}
function hash2i(x,z,seed){
  return hashU32((Math.imul(x|0, 374761393) ^ Math.imul(z|0, 668265263) ^ seed) >>> 0) / 4294967295;
}
function valueNoise2D(x,z,seed){
  const xi=Math.floor(x), zi=Math.floor(z), xf=x-xi, zf=z-zi;
  const u=xf*xf*(3-2*xf), v=zf*zf*(3-2*zf);
  const a=hash2i(xi,zi,seed), b=hash2i(xi+1,zi,seed), c=hash2i(xi,zi+1,seed), d=hash2i(xi+1,zi+1,seed);
  return lerp(lerp(a,b,u),lerp(c,d,u),v);
}
function fbm2(x,z,seed){
  let sum=0, amp=.5, norm=0;
  for(let i=0;i<4;i++){
    sum += valueNoise2D(x,z,seed+i*1013)*amp; norm+=amp;
    x*=2.03; z*=2.03; amp*=.5;
  }
  return sum/norm;
}
function valueNoise1D(x,seed){
  const i=Math.floor(x), f=x-i, u=f*f*(3-2*f);
  const a=hashU32((i ^ seed)>>>0)/4294967295;
  const b=hashU32(((i+1) ^ seed)>>>0)/4294967295;
  return lerp(a,b,u);
}
function mulberry32(seed){
  let a=seed>>>0;
  return function(){
    a=(a+0x6D2B79F5)>>>0;
    let t=a; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61);
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}

const V3 = {
  set(o,x,y,z){o[0]=x;o[1]=y;o[2]=z;return o;},
  copy(o,a){o[0]=a[0];o[1]=a[1];o[2]=a[2];return o;},
  add(o,a,b){o[0]=a[0]+b[0];o[1]=a[1]+b[1];o[2]=a[2]+b[2];return o;},
  sub(o,a,b){o[0]=a[0]-b[0];o[1]=a[1]-b[1];o[2]=a[2]-b[2];return o;},
  scale(o,a,s){o[0]=a[0]*s;o[1]=a[1]*s;o[2]=a[2]*s;return o;},
  len(a){return Math.hypot(a[0],a[1],a[2]);},
  norm(o,a){const l=Math.hypot(a[0],a[1],a[2])||1;o[0]=a[0]/l;o[1]=a[1]/l;o[2]=a[2]/l;return o;},
  cross(o,a,b){const ax=a[0],ay=a[1],az=a[2],bx=b[0],by=b[1],bz=b[2];o[0]=ay*bz-az*by;o[1]=az*bx-ax*bz;o[2]=ax*by-ay*bx;return o;},
  dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
};

const M4 = {
  create(){const o=new Float32Array(16); return M4.identity(o);},
  identity(o){o.fill(0);o[0]=o[5]=o[10]=o[15]=1;return o;},
  perspective(o,fovy,aspect,near,far){
    const f=1/Math.tan(fovy/2), nf=1/(near-far);
    o[0]=f/aspect;o[1]=0;o[2]=0;o[3]=0;
    o[4]=0;o[5]=f;o[6]=0;o[7]=0;
    o[8]=0;o[9]=0;o[10]=(far+near)*nf;o[11]=-1;
    o[12]=0;o[13]=0;o[14]=2*far*near*nf;o[15]=0; return o;
  },
  lookAt(o,eye,target,up){
    let zx=eye[0]-target[0], zy=eye[1]-target[1], zz=eye[2]-target[2];
    let l=Math.hypot(zx,zy,zz)||1; zx/=l;zy/=l;zz/=l;
    let xx=up[1]*zz-up[2]*zy, xy=up[2]*zx-up[0]*zz, xz=up[0]*zy-up[1]*zx;
    l=Math.hypot(xx,xy,xz)||1;xx/=l;xy/=l;xz/=l;
    const yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
    o[0]=xx;o[1]=yx;o[2]=zx;o[3]=0;
    o[4]=xy;o[5]=yy;o[6]=zy;o[7]=0;
    o[8]=xz;o[9]=yz;o[10]=zz;o[11]=0;
    o[12]=-(xx*eye[0]+xy*eye[1]+xz*eye[2]);
    o[13]=-(yx*eye[0]+yy*eye[1]+yz*eye[2]);
    o[14]=-(zx*eye[0]+zy*eye[1]+zz*eye[2]);o[15]=1; return o;
  },
  multiply(o,a,b){
    const a00=a[0],a01=a[1],a02=a[2],a03=a[3],a10=a[4],a11=a[5],a12=a[6],a13=a[7],a20=a[8],a21=a[9],a22=a[10],a23=a[11],a30=a[12],a31=a[13],a32=a[14],a33=a[15];
    let b0,b1,b2,b3;
    b0=b[0];b1=b[1];b2=b[2];b3=b[3];o[0]=b0*a00+b1*a10+b2*a20+b3*a30;o[1]=b0*a01+b1*a11+b2*a21+b3*a31;o[2]=b0*a02+b1*a12+b2*a22+b3*a32;o[3]=b0*a03+b1*a13+b2*a23+b3*a33;
    b0=b[4];b1=b[5];b2=b[6];b3=b[7];o[4]=b0*a00+b1*a10+b2*a20+b3*a30;o[5]=b0*a01+b1*a11+b2*a21+b3*a31;o[6]=b0*a02+b1*a12+b2*a22+b3*a32;o[7]=b0*a03+b1*a13+b2*a23+b3*a33;
    b0=b[8];b1=b[9];b2=b[10];b3=b[11];o[8]=b0*a00+b1*a10+b2*a20+b3*a30;o[9]=b0*a01+b1*a11+b2*a21+b3*a31;o[10]=b0*a02+b1*a12+b2*a22+b3*a32;o[11]=b0*a03+b1*a13+b2*a23+b3*a33;
    b0=b[12];b1=b[13];b2=b[14];b3=b[15];o[12]=b0*a00+b1*a10+b2*a20+b3*a30;o[13]=b0*a01+b1*a11+b2*a21+b3*a31;o[14]=b0*a02+b1*a12+b2*a22+b3*a32;o[15]=b0*a03+b1*a13+b2*a23+b3*a33;return o;
  },
  fromTRS(o,x,y,z,yaw,pitch,roll,sx=1,sy=1,sz=1){
    const cy=Math.cos(yaw),syw=Math.sin(yaw), cp=Math.cos(pitch),sp=Math.sin(pitch), cr=Math.cos(roll),sr=Math.sin(roll);
    // R = Ry * Rx * Rz (column-major)
    const m00=cy*cr+syw*sp*sr, m01=cp*sr, m02=-syw*cr+cy*sp*sr;
    const m10=-cy*sr+syw*sp*cr, m11=cp*cr, m12=syw*sr+cy*sp*cr;
    const m20=syw*cp, m21=-sp, m22=cy*cp;
    o[0]=m00*sx;o[1]=m01*sx;o[2]=m02*sx;o[3]=0;
    o[4]=m10*sy;o[5]=m11*sy;o[6]=m12*sy;o[7]=0;
    o[8]=m20*sz;o[9]=m21*sz;o[10]=m22*sz;o[11]=0;
    o[12]=x;o[13]=y;o[14]=z;o[15]=1; return o;
  }
};

function normalMat3FromMat4(o,m){
  const a00=m[0],a01=m[1],a02=m[2],a10=m[4],a11=m[5],a12=m[6],a20=m[8],a21=m[9],a22=m[10];
  const b01=a22*a11-a12*a21,b11=-a22*a10+a12*a20,b21=a21*a10-a11*a20;
  let det=a00*b01+a01*b11+a02*b21;
  if(Math.abs(det)<1e-8){o[0]=1;o[1]=0;o[2]=0;o[3]=0;o[4]=1;o[5]=0;o[6]=0;o[7]=0;o[8]=1;return o;}
  det=1/det;
  const i0=b01*det,i1=(-a22*a01+a02*a21)*det,i2=(a12*a01-a02*a11)*det;
  const i3=b11*det,i4=(a22*a00-a02*a20)*det,i5=(-a12*a00+a02*a10)*det;
  const i6=b21*det,i7=(-a21*a00+a01*a20)*det,i8=(a11*a00-a01*a10)*det;
  o[0]=i0;o[1]=i3;o[2]=i6;o[3]=i1;o[4]=i4;o[5]=i7;o[6]=i2;o[7]=i5;o[8]=i8;return o;
}

// ------------------------------------------------------------
// 2. Shader / Renderer / Mesh
// ------------------------------------------------------------
class GLProgram{
  constructor(gl,vs,fs){
    this.gl=gl; this.program=this._link(vs,fs); this.u={};
  }
  _compile(type,src){
    const s=this.gl.createShader(type); this.gl.shaderSource(s,src); this.gl.compileShader(s);
    if(!this.gl.getShaderParameter(s,this.gl.COMPILE_STATUS)){
      const log=this.gl.getShaderInfoLog(s)||'未知 Shader 编译错误'; this.gl.deleteShader(s); throw new Error(log);
    } return s;
  }
  _link(vs,fs){
    const v=this._compile(this.gl.VERTEX_SHADER,vs), f=this._compile(this.gl.FRAGMENT_SHADER,fs), p=this.gl.createProgram();
    this.gl.attachShader(p,v);this.gl.attachShader(p,f);this.gl.linkProgram(p);this.gl.deleteShader(v);this.gl.deleteShader(f);
    if(!this.gl.getProgramParameter(p,this.gl.LINK_STATUS)){const log=this.gl.getProgramInfoLog(p)||'未知 Program 链接错误';throw new Error(log);} return p;
  }
  use(){this.gl.useProgram(this.program)}
  loc(n){return this.u[n]||(this.u[n]=this.gl.getUniformLocation(this.program,n));}
}

class Mesh{
  constructor(gl,dynamic=false){
    this.gl=gl;this.dynamic=dynamic;this.vao=gl.createVertexArray();this.vbo=gl.createBuffer();this.ibo=gl.createBuffer();this.count=0;
    gl.bindVertexArray(this.vao); gl.bindBuffer(gl.ARRAY_BUFFER,this.vbo);
    const stride=10*4;
    gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,stride,0);
    gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,3,gl.FLOAT,false,stride,3*4);
    gl.enableVertexAttribArray(2);gl.vertexAttribPointer(2,4,gl.FLOAT,false,stride,6*4);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,this.ibo);gl.bindVertexArray(null);
  }
  update(vertices,indices){
    const gl=this.gl;this.count=indices.length;
    gl.bindVertexArray(this.vao);gl.bindBuffer(gl.ARRAY_BUFFER,this.vbo);
    gl.bufferData(gl.ARRAY_BUFFER,vertices,this.dynamic?gl.DYNAMIC_DRAW:gl.STATIC_DRAW);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,this.ibo);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,indices,this.dynamic?gl.DYNAMIC_DRAW:gl.STATIC_DRAW);
    gl.bindVertexArray(null);
  }

  }

// 8. Input
// ------------------------------------------------------------
class Input{
  constructor(){
    this.keys=new Set();this.just=new Set();this.virtualKeys=new Set();
    addEventListener('keydown',e=>{
      if(this.isInteractiveTarget(e.target))return;
      const k=e.code;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(k))e.preventDefault();
      if(!this.keys.has(k))this.just.add(k);this.keys.add(k);game?.audio.ensureStarted();
    },{passive:false});
    addEventListener('keyup',e=>this.keys.delete(e.code));
    addEventListener('blur',()=>{this.keys.clear();this.virtualKeys.clear();$touchControls?.querySelectorAll('.active').forEach(btn=>btn.classList.remove('active'));});
    this.bindTouchControls();
  }
  isInteractiveTarget(target){return target instanceof Element && !!target.closest('button,input,select,textarea,a,[role="button"]');}
  bindTouchControls(){
    if(!$touchControls)return;
    for(const btn of $touchControls.querySelectorAll('[data-key]')){
      const code=btn.dataset.key;
      const release=()=>{this.virtualKeys.delete(code);btn.classList.remove('active');};
      btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.setPointerCapture?.(e.pointerId);if(!this.virtualKeys.has(code))this.just.add(code);this.virtualKeys.add(code);btn.classList.add('active');game?.audio.ensureStarted();},{passive:false});
      btn.addEventListener('pointerup',release);btn.addEventListener('pointercancel',release);btn.addEventListener('lostpointercapture',release);
    }
  }
  down(...codes){for(const c of codes)if(this.keys.has(c)||this.virtualKeys.has(c))return true;return false;}
  take(code){if(this.just.has(code)){this.just.delete(code);return true;}return false;}
  clearCode(code){this.keys.delete(code);this.virtualKeys.delete(code);this.just.delete(code);}
  endFrame(){this.just.clear();}
}

  }
  commands(){
    if(this.input.take('KeyC'))this.camera.cycle();if(this.input.take('KeyT'))this.toggleAutoDrive();if(this.input.take('KeyH'))this.ui.toggleHelp();if(this.input.take('KeyM'))this.audio.toggle();if(this.input.take('F2'))this.ui.toggleDebug();if(this.input.take('KeyP')||this.input.take('Escape'))this.togglePause();
  }
  frame(now){
    this.rafId=0;if(!this.running||this.paused)return;const rawDt=(now-this.last)/1000;let dt=Math.min(rawDt,.0333);this.last=now;this.commands();
    if(this.paused){this.input.endFrame();return;}
    // Manual braking/handbrake always cancels automatic throttle.
    if(this.autoDrive&&(this.input.down('KeyS','ArrowDown')||this.input.down('Space')))this.toggleAutoDrive(false);
    // Two small physics steps reduce tunneling and steering variance on slower frames.
    const steps=dt>.020?2:1,sd=dt/steps;for(let i=0;i<steps;i++)this.vehicle.update(sd,this.input,this.autoDrive);this.world.maybeShiftOrigin(this.vehicle,this.camera);
    this.camera.update(dt,this.vehicle);this.audio.update(this.vehicle.speed);
    const env=ENVIRONMENTS[this.envIndex];this.renderer.begin(this.camera,env);this.world.render(this.renderer,this.camera,env);this.vehicle.render(this.renderer,env);this.quality.update(rawDt);this.ui.update(dt);this.input.endFrame();this.requestFrame();
  }
}

// ------------------------------------------------------------
// 14. Seed / Bootstrap
// ------------------------------------------------------------
function getSeed(){
  const m=location.hash.match(/(?:^#|[&#])seed=(\d+)/i);if(m)return (Number(m[1])>>>0)||1;
  try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]||1;}catch(_){return (Date.now()>>>0)||1;}
}

let game=null;
try{
  if(gl){game=new Game(gl,getSeed());canvas.focus();}
}catch(e){console.error(e);fatal('启动失败',`WebGL 初始化或 Shader 编译失败：${e && e.message ? e.message : e}`);}
